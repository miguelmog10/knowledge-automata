[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-automata"
dynamic = ["version"]
description = "Knowledge on autopilot: the living memory of any group that makes decisions together."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Morales" }]
dependencies = [
    "cohere>=7.3",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pip-audit",
    "pytest",
    "ruff==0.17.2",
]

[project.scripts]
knowledge-automata = "knowledge_automata.cli:main"

[project.urls]
Repository = "https://github.com/miguelmog10/knowledge-automata"

[tool.hatch.version]
path = "src/knowledge_automata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_automata"]

# schemas/ and prompts/ stay at the repository root as language-neutral contracts; the wheel
# ships a copy.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "knowledge_automata/schemas"
"prompts" = "knowledge_automata/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Handoffs are committed records of what was agreed; ruff must not reformat their code blocks.
extend-exclude = ["dev/handoffs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
