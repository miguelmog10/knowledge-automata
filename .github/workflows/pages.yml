name: Pages

# Publishes the visual guide and the diagram sources it renders (ADR-0016).
# Only docs/guide/index.html and docs/diagrams/*.md are published, never the rest of docs/.
# One-time setup: Settings, Pages, Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/index.html"
      - "docs/diagrams/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/guide _site/diagrams
          cp docs/guide/index.html _site/guide/index.html
          cp docs/diagrams/*.md _site/diagrams/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Knowledge Automata guide</title>
          <meta http-equiv="refresh" content="0; url=guide/">
          <link rel="canonical" href="guide/">
          </head>
          <body>
          <p><a href="guide/">Open the Knowledge Automata guide</a></p>
          </body>
          </html>
          HTML
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}guide/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
